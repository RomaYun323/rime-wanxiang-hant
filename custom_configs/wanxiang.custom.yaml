patch:
  speller/algebra:
    __patch:
      - wanxiang_algebra:/base/小鹤双拼
  grammar/language: wanxiang-lts-zh-hant
  time_formats: [H:M, H點M分, H:M:S, H時M分S秒, AI:M, I:M P]
  datetime_formats:
    - Y-m-d H:M:S
    - Y-m-dTH:M:S O
    - YmdHMS
    - Y年m月d日 H點M分
    - y/m/d I:M p
  key_binder/bindings/+:
    - when: paging
      accept: comma
      send: Page_Up
    - when: has_menu
      accept: period
      send: Page_Down
    - when: has_menu
      accept: semicolon
      send: 2
  switches:
    - name: ascii_mode
      states: [中文, 英文]
    - name: ascii_punct
      states: [中标, 英标]
    - name: full_shape
      states: [半角, 全角]
    - name: emoji
      states: [表情关, 表情开]
    - name: chinese_english
      states: [翻译关, 翻译开]
    - name: prediction
      states: [预测关, 预测开]
    - options:
        - raw_input
        - tone_display
        - full_pinyin
      states: [原编码, 有声调, 无声调]
    - options: [t2t, t2s, t2hk, t2tw]
      states: [通繁, 简体, 港繁, 臺繁]
      reset: 3
    - name: abbrev
      reset: 1
      states: [简码关, 简码开]
    - options:
        - comment_off
        - tone_hint
        - toneless_hint
      states: [注释关, 有声调, 无声调]
    - name: super_tips
      states: [提示关, 提示开]
    - name: charset_filter
      states: [大字集, 小字集]
    - name: char_priority
      states: [词组先, 单字先]
    - name: english
      reset: 1
      states: [英文关, 英文开]
  super_replacer/rules:
    - comment_mode: none
      files:
        - lua/data/emoji.txt
      mode: append
      option: emoji
      prefix: _em_
      tags: [abc]
    - comment_mode: none
      files:
        - lua/data/english_chinese.txt
        - lua/data/chinese_english.txt
      mode: append
      option: chinese_english
      prefix: _en_
      tags: [abc]
    - comment_mode: none
      files:
        - lua/data/others.txt
      mode: append
      option: true
      prefix: _ot_
      tags: [abc]
    - comment_mode: append
      files:
        - lua/data/TSCharacters.txt
        - lua/data/TSPhrases.txt
      mode: replace
      option: [t2s]
      prefix: _t2s_
      sentence: true
      tags: [abc]
    - comment_mode: append
      files:
        - lua/data/HKVariants.txt
      mode: replace
      option: t2hk
      prefix: _t2hk_
      sentence: true
      tags: [abc]
    - comment_mode: append
      files:
        - lua/data/TWVariants.txt
      mode: replace
      option: t2tw
      prefix: _t2tw_
      sentence: true
      tags: [abc]
    - abbrev_rule: 1,6
      exclude_types: [pinyin]
      files:
        - lua/data/abbrev.txt
        - lua/data/chengyu.txt
      mode: abbrev
      option: abbrev
      prefix: _abbr_
      tags: [abc]
    - abbrev_rule: 1,3
      files:
        - lua/data/en_abbrev.txt
      mode: abbrev
      option: true
      prefix: _enabb_
      tags: [abc]
    - files:
        - lua/data/derive.txt
      mode: append
      option: true
      tags: [abc]
  charset_filter:
    - addlist:
        - 诶濛硷氽尛躝〇冇吔磺咗囧屌鲶芶咲畑垅𰻝𰻞龍朙頔雲
      base: T
      blacklist: []
      option: charset_filter
    - addlist: []
      base: jg
      blacklist: []
      option: t2s
    - addlist: []
      base: hT
      blacklist: []
      option: t2hk
    - addlist: []
      base: fT
      blacklist: []
      option: t2tw
