patch:
  grammar/language: wanxiang-lts-zh-hant
  switches/@7/options: [t2t, t2s, t2hk, t2tw]
  switches/@7/states: [通繁, 简体, 港繁, 臺繁]
  switches/@7/reset: 3
  # switches/@6/reset: 2
  engine/filters/@6: simplifier@t2s
  engine/filters/@7: simplifier@t2hk
  engine/filters/@8: simplifier@t2tw
  charset_filter/@0/base: T
  charset_filter/@1/base: jg
  charset_filter/@1/option: t2s
  charset_filter/@2/base: hT
  charset_filter/@2/option: t2hk
  charset_filter/@3/base: fT
  charset_filter/@3/option: t2tw
  time_formats: [H:M, H點M分, H:M:S, H時M分S秒, AI:M, I:M P]
  datetime_formats:
    - Y-m-d H:M:S
    - Y-m-dTH:M:S O
    - YmdHMS
    - Y年m月d日 H點M分
    - y/m/d I:M p
  key_binder/bindings/@4/toggle: t2s
  key_binder/bindings/@5/toggle: t2s
  key_binder/bindings/@4/toggle: t2s
  key_binder/bindings/@5/toggle: t2s
  super_replacer/chain: false
  s2t:
  s2hk:
  s2tw:
  t2s:
    option_name: t2s
    opencc_config: wanxiang_t2s.json
    tips: none
    tags: [abc]

  t2hk:
    option_name: t2hk
    opencc_config: wanxiang_t2hk.json
    tips: none
    tags: [abc]

  t2tw:
    option_name: t2tw
    opencc_config: wanxiang_t2tw.json
    tips: none
    tags: [abc]
  speller/algebra:
    __patch:
      - wanxiang_algebra:/base/小鹤双拼
  key_binder/bindings/+:
    - when: paging
      accept: comma
      send: Page_Up
    - when: has_menu
      accept: period
      send: Page_Down
    - when: has_menu
      accept: semicolon
      send: 2
#  translator/packs: [contacts]
#  custom_phrase/dictionary: my_phrase
#  punctuator/symbols/+:
