patch:
  speller/algebra:
    __patch:
      - wanxiang_algebra:/base/小鹤双拼
  custom_phrase/db_class: stabledb
  switches:
    - name: ascii_mode
      states: [中文, 英文]
    - name: ascii_punct
      states: [中标, 英标]
    - name: full_shape
      states: [半角, 全角]
    - name: emoji
      states: [表情关, 表情开]
    - name: chinese_english
      states: [翻译关, 翻译开]
    - name: context_reorder
      states: [上下文关, 上下文开]
    - options:
        - raw_input
        - tone_display
        - full_pinyin
      states: [原编码, 有声调, 无声调]
    - options: [t2t, t2s, t2hk, t2tw]
      states: [通繁, 简体, 港繁, 臺繁]
      reset: 3
    - name: abbrev
      reset: 1
      states: [简码关, 简码开]
    - options:
        - comment_off
        - tone_hint
        - toneless_hint
      states: [注释关, 有声调, 无声调]
    - name: super_tips
      states: [提示关, 提示开]
    - name: charset_filter
      states: [大字集, 小字集]
    - name: char_priority
      states: [词组先, 单字先]
    - name: english
      reset: 1
      states: [英文关, 英文开]
  engine/filters:
    - lua_filter@*wanxiang.charset_filter
    - lua_filter@*wanxiang.super_lookup
    - lua_filter@*wanxiang.custom_phrase
    - lua_filter@*wanxiang.context_reorder*F
    - lua_filter@*wanxiang.charset_filter
    - lua_filter@*wanxiang.super_comment_preedit
    - simplifier@t2s
    - simplifier@t2hk
    - simplifier@t2tw
    - simplifier@emoji
    - lua_filter@*wanxiang.super_replacer
    - lua_filter@*wanxiang.super_filter
    - lua_filter@*wanxiang.super_english*F
    - lua_filter@*wanxiang.super_sequence*F
    - uniquifier
  grammar/language: wanxiang-lts-zh-hant
  charset_filter:
    - addlist:
        - 诶濛硷氽尛躝〇冇吔磺咗囧屌鲶芶咲畑垅𰻝𰻞龍朙頔雲
      base: T
      blacklist: []
      option: charset_filter
    - addlist: []
      base: jg
      blacklist: []
      option: t2s
    - addlist: []
      base: hT
      blacklist: []
      option: t2hk
    - addlist: []
      base: fT
      blacklist: []
      option: t2tw
  key_binder/bindings:
    - accept: minus
      send: Page_Up
      when: has_menu
    - accept: equal
      send: Page_Down
      when: has_menu
    - accept: Control+Shift+3
      toggle: ascii_punct
      when: always
    - accept: Control+Shift+numbersign
      toggle: ascii_punct
      when: always
    - accept: Control+Shift+4
      toggle: t2s
      when: always
    - accept: Control+Shift+dollar
      toggle: t2s
      when: always
    - accept: Alt+Left
      send: Shift+Left
      when: composing
    - accept: Alt+Right
      send: Shift+Right
      when: composing
    - accept: Control+w
      send: Control+BackSpace
      when: composing
    - accept: Control+e
      toggle: chinese_english
      when: has_menu
    - accept: Control+a
      toggle: tone_hint
      when: has_menu
    - accept: Control+s
      toggle: tone_display
      when: has_menu
    - accept: Control+t
      toggle: super_tips
      when: has_menu
    - accept: Control+g
      toggle: charset_filter
      when: has_menu
    - accept: Control+g
      toggle: charset_filter
      when: composing
    - accept: Shift+space
      select: .next
      when: always
    - accept: Tab
      send: Control+Right
      when: has_menu
    - accept: Tab
      send: Control+Right
      when: composing
    - accept: Control+Tab
      send_sequence: '{Home}{Shift+Right}{1}{Shift+Right}'
      when: composing
    - accept: /
      send_sequence: '{space}'
      match: ^/$
    - accept: Shift+Return
      send_sequence: '{option:tone_display=true}{Shift+Return}{option:tone_display=false}'
    - accept: comma
      send: Page_Up
      when: paging
    - accept: period
      send: Page_Down
      when: has_menu
  super_replacer/chain: false
  
  s2t: null
  s2hk: null
  s2tw: null

  t2s:
    option_name: t2s
    opencc_config: wanxiang_t2s.json
    tips: none
    tags: [abc]

  t2hk:
    option_name: t2hk
    opencc_config: wanxiang_t2hk.json
    tips: none
    tags: [abc]

  t2tw:
    option_name: t2tw
    opencc_config: wanxiang_t2tw.json
    tips: none
    tags: [abc]