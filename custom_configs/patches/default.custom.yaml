patch:
  switcher/save_options:
    - ascii_punct
    - t2s
    - t2hk
    - t2tw
    - emoji
    - full_shape
    - context_reorder
    - super_tips
    - charset_filter
    - chaifen_switch
    - tone_display
    - fuzhu_hint
    - tone_hint
    - full_pinyin
    - english_chinese
    - english
    - search_single_char
    - abbrev
  selector/bindings/Left: previous_page
  selector/bindings/Right: next_page
  key_binder/bindings:
    - accept: Control+k
      when: composing
      toggle: xxxxx
    - accept: KP_0
      send: '0'
      when: composing
    - accept: KP_1
      when: composing
      send: '1'
    - accept: KP_2
      send: '2'
      when: composing
    - accept: KP_3
      send: '3'
      when: composing
    - accept: KP_4
      send: '4'
      when: composing
    - accept: KP_5
      send: '5'
      when: composing
    - accept: KP_6
      send: '6'
      when: composing
    - accept: KP_7
      send: '7'
      when: composing
    - accept: KP_8
      send: '8'
      when: composing
    - accept: KP_9
      send: '9'
      when: composing
    - accept: KP_Decimal
      send: 'period'
      when: composing
    - accept: KP_Multiply
      send: 'asterisk'
      when: composing
    - accept: KP_Add
      send: plus
      when: composing
    - accept: KP_Subtract
      send: minus
      when: composing
    - accept: KP_Divide
      send: slash
      when: composing
    - accept: KP_Enter
      send: Return
      when: composing
