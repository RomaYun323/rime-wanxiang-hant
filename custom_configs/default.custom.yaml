patch:
  switcher/save_options:
    - ascii_punct
    - t2s
    - t2hk
    - t2tw
    - emoji
    - full_shape
    - prediction
    - super_tips
    - charset_filter
    - chaifen_switch
    - tone_display
    - fuzhu_hint
    - tone_hint
    - full_pinyin
    - chinese_english
    - search_single_char
    - abbrev
  key_binder/bindings:
    - accept: minus
      send: Page_Up
      when: has_menu
    - accept: equal
      send: Page_Down
      when: has_menu
    - accept: Control+k
      toggle: xxxxx
      when: composing
    - accept: KP_0
      send: '0'
      when: composing
    - accept: KP_1
      send: '1'
      when: composing
    - accept: KP_2
      send: '2'
      when: composing
    - accept: KP_3
      send: '3'
      when: composing
    - accept: KP_4
      send: '4'
      when: composing
    - accept: KP_5
      send: '5'
      when: composing
    - accept: KP_6
      send: '6'
      when: composing
    - accept: KP_7
      send: '7'
      when: composing
    - accept: KP_8
      send: '8'
      when: composing
    - accept: KP_9
      send: '9'
      when: composing
    - accept: KP_Decimal
      send: period
      when: composing
    - accept: KP_Multiply
      send: asterisk
      when: composing
    - accept: KP_Add
      send: plus
      when: composing
    - accept: KP_Subtract
      send: minus
      when: composing
    - accept: KP_Divide
      send: slash
      when: composing
    - accept: KP_Enter
      send: Return
      when: composing
