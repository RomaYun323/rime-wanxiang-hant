name: Build wanxiang-base-hant

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-wanxiang-base-hant
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc python3-yaml rsync

      - name: Fetch upstream scheme and official Traditional dictionaries
        run: |
          git clone --depth 1 --branch wanxiang https://github.com/amzxyz/rime-wanxiang.git "$RUNNER_TEMP/wanxiang"
          git clone --depth 1 --branch wanxiang https://github.com/amzxyz/RIME-LMDG.git "$RUNNER_TEMP/lmdg"
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hant.gram \
            -o "$RUNNER_TEMP/wanxiang-lts-zh-hant.gram"
          test -s "$RUNNER_TEMP/wanxiang-lts-zh-hant.gram"
          mkdir -p "$RUNNER_TEMP/opencc-source"
          for name in TSCharacters TSPhrases; do
            curl --fail --location --retry 5 --retry-all-errors \
              "https://raw.githubusercontent.com/BYVoid/OpenCC/master/data/dictionary/${name}.txt" \
              -o "$RUNNER_TEMP/opencc-source/${name}.txt"
          done

      - name: Build and validate Traditional scheme
        run: |
          python3 .github/scripts/build_hant.py \
            --upstream "$RUNNER_TEMP/wanxiang" \
            --lmdg "$RUNNER_TEMP/lmdg" \
            --custom custom_configs \
            --opencc-source "$RUNNER_TEMP/opencc-source" \
            --output "$RUNNER_TEMP/hant" \
            --gram "$RUNNER_TEMP/wanxiang-lts-zh-hant.gram" \
            --archives "$RUNNER_TEMP/packages"

      - name: Save generated source
        id: source
        run: |
          rsync -a --delete \
            --exclude='.git/' --exclude='.github/' --exclude='custom_configs/' \
            --exclude='.gitignore' --exclude='README.md' \
            --exclude='wanxiang-lts-zh-hant.gram' \
            "$RUNNER_TEMP/hant/" ./
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: generate Traditional wanxiang scheme'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          VERSION=$(tr -d '\r\n' < version.txt)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=v${VERSION}-hant.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Publish Traditional packages
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ steps.source.outputs.sha }}
          tag_name: ${{ steps.source.outputs.tag }}
          name: ${{ steps.source.outputs.tag }} 萬象拼音繁體方案
          fail_on_unmatched_files: true
          body: |
            上游 wanxiang 方案搭配 RIME-LMDG 官方 dicts_hant 繁體詞庫。
            已內建繁體設定，預設臺灣字形，無需舊版繁體補丁。
            - rime-wanxiang-base.zip：不含語言模型，另放入 wanxiang-lts-zh-hant.gram。
            - rime-wanxiang-full.zip：包含繁體語言模型。
            升級前請備份個人設定；請移除舊版針對 super_replacer 的繁體補丁。
            build-info.json 記錄本次上游與詞庫來源提交。
          files: |
            ${{ runner.temp }}/packages/rime-wanxiang-base.zip
            ${{ runner.temp }}/packages/rime-wanxiang-full.zip
