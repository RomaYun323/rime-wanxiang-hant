name: Build wanxiang-base-hant

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: build-wanxiang-base-hant
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      configs: ${{ steps.check.outputs.configs }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Check upstream and config changes
        run: |
          git fetch --force origin refs/tags/custom-configs:refs/tags/custom-configs || true

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "configs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f build-info.json ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            recorded_scheme=$(python3 -c 'import json; print(json.load(open("build-info.json"))["scheme"])')
            recorded_dicts=$(python3 -c 'import json; print(json.load(open("build-info.json"))["dicts_hant"])')
            latest_scheme=$(git ls-remote https://github.com/amzxyz/rime-wanxiang.git refs/heads/wanxiang-base | cut -f1)
            latest_dicts=$(git ls-remote https://github.com/amzxyz/RIME-LMDG.git refs/heads/wanxiang | cut -f1)
            if [[ "$recorded_scheme" == "$latest_scheme" && "$recorded_dicts" == "$latest_dicts" ]]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          if ! git rev-parse --verify --quiet refs/tags/custom-configs; then
            echo "configs=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet custom-configs HEAD -- \
            custom_configs/wanxiang.custom.yaml custom_configs/default.custom.yaml; then
            echo "configs=false" >> "$GITHUB_OUTPUT"
          else
            echo "configs=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc python3-yaml rsync

      - name: Fetch upstream scheme and official Traditional dictionaries
        run: |
          git clone --depth 1 --branch wanxiang-base https://github.com/amzxyz/rime-wanxiang.git "$RUNNER_TEMP/wanxiang"
          git clone --depth 1 --branch wanxiang https://github.com/amzxyz/RIME-LMDG.git "$RUNNER_TEMP/lmdg"
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hant.gram \
            -o "$RUNNER_TEMP/wanxiang-lts-zh-hant.gram"
          test -s "$RUNNER_TEMP/wanxiang-lts-zh-hant.gram"
          mkdir -p "$RUNNER_TEMP/opencc-source"
          # OpenCC 官方提供文字來源，缺少的標準詞典由這裡補齊後編譯。
          for name in TSCharacters TSPhrases HKVariants TWVariants; do
            curl --fail --location --retry 5 --retry-all-errors \
              "https://raw.githubusercontent.com/BYVoid/OpenCC/master/data/dictionary/${name}.txt" \
              -o "$RUNNER_TEMP/opencc-source/${name}.txt"
          done

      - name: Build and validate Traditional scheme
        run: |
          python3 .github/scripts/build_hant.py \
            --upstream "$RUNNER_TEMP/wanxiang" \
            --lmdg "$RUNNER_TEMP/lmdg" \
            --custom custom_configs \
            --opencc-source "$RUNNER_TEMP/opencc-source" \
            --output "$RUNNER_TEMP/hant" \
            --gram "$RUNNER_TEMP/wanxiang-lts-zh-hant.gram"

      - name: Validate and package compiled OpenCC configs
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import zipfile

          root = Path(os.environ["RUNNER_TEMP"]) / "hant"
          runpy.run_path(".github/scripts/build_hant.py")["validate"](root)
          gram = root / "wanxiang-lts-zh-hant.gram"
          if not gram.is_file() or gram.stat().st_size == 0:
              raise ValueError("Traditional language model is missing or empty")
          packages = Path(os.environ["RUNNER_TEMP"]) / "packages"
          packages.mkdir(parents=True, exist_ok=True)
          for kind in ("base", "full"):
              with zipfile.ZipFile(packages / f"rime-wanxiang-{kind}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(root.rglob("*")):
                      if path.is_file() and path.name != "build-info.json" and not (kind == "base" and path.suffix == ".gram"):
                          archive.write(path, path.relative_to(root))
          PY

      - name: Save generated source
        id: source
        run: |
          rsync -a --delete \
            --exclude='.git/' --exclude='.github/' --exclude='custom_configs/' \
            --exclude='.gitignore' --exclude='README.md' \
            --exclude='wanxiang-lts-zh-hant.gram' \
            "$RUNNER_TEMP/hant/" ./
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: generate Traditional wanxiang scheme'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          VERSION=$(tr -d '\r\n' < version.txt)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish Traditional packages
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ steps.source.outputs.sha }}
          tag_name: ${{ steps.source.outputs.tag }}
          name: ${{ steps.source.outputs.tag }} Rime万象拼音输入方案-繁體詞庫
          fail_on_unmatched_files: true
          body: |
            自動編譯同步的客製化繁體 RIME 方案包。

            📦 **兩種版本供選擇（不含繁體補丁）**

            - `rime-wanxiang-base.zip`：不含大模型語法包
            - `rime-wanxiang-full.zip`：包含大模型語法包 (wanxiang-lts-zh-hant.gram)

            📥 **繁體大模型語法包 官方 Release(必裝)**

            - [wanxiang-lts-zh-hant.gram](https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hant.gram)：大模型語法包

            ⚙️ **繁體方案補丁下載（必裝）**：

            - [wanxiang.custom.yaml](https://github.com/RomaYun323/rime-wanxiang-hant/releases/download/custom-configs/wanxiang.custom.yaml)：繁體方案補丁，否則繁體方案無法生效
            - [default.custom.yaml](https://github.com/RomaYun323/rime-wanxiang-hant/releases/download/custom-configs/default.custom.yaml)：全域選項保存設定
          files: |
            ${{ runner.temp }}/packages/rime-wanxiang-base.zip
            ${{ runner.temp }}/packages/rime-wanxiang-full.zip

  publish-configs:
    needs: check-upstream
    if: needs.check-upstream.outputs.configs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update custom configs tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f custom-configs "$GITHUB_SHA"
          git push -f origin custom-configs

      - name: Publish updated config files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-configs
          name: 萬象輸入法繁體方案補丁
          make_latest: false
          body: |
            - `wanxiang.custom.yaml`：繁體方案補丁
            - `default.custom.yaml`：全域選項保存設定
          files: |
            custom_configs/wanxiang.custom.yaml
            custom_configs/default.custom.yaml
