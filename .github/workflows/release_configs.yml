name: Publish Configs Release

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update custom configs tag
        run: |
          git tag -f custom-configs
          git push -f origin custom-configs

      - name: Create or update configs release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-configs
          name: 萬象輸入法繁體方案補丁
          make_latest: false
          body: |
            - `wanxiang.custom.yaml`：繁體方案補丁
            - `default.custom.yaml`：全域選項保存設定
          files: |
            custom_configs/wanxiang.custom.yaml
            custom_configs/default.custom.yaml
