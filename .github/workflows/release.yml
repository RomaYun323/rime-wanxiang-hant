name: Publish Release

on:
  workflow_dispatch: {} # 接收另一個 workflow 的觸發，或是手動點擊執行

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Release Env
        run: |
          # 取得版號 (與你原本的邏輯相同)
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt)
          else
            VERSION=$(date +'%Y%m%d%H%M')
          fi
          echo "RELEASE_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "RELEASE_TITLE=v$VERSION Rime万象拼音输入方案-繁體詞庫" >> $GITHUB_ENV
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            自動編譯同步的客製化繁體 RIME 環境包。
            📥 **繁體模型官方 Release**：[Rime万象语法模型](https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hant.gram)
            
            ⚙️ **單獨設定檔與詞庫下載 (請對連結按「右鍵 ➔ 另存連結」)**：
            [⬇️ wanxiang.custom.yaml](https://raw.githubusercontent.com/${{ github.repository }}/main/custom_configs/wanxiang.custom.yaml)
            [⬇️ contacts.dict.yaml](https://raw.githubusercontent.com/${{ github.repository }}/main/custom_configs/contacts.dict.yaml)
            
            📦 **兩種版本供選擇**：
            1. `rime-wanxiang-base.zip`：**不含大模型**
            2. `rime-wanxiang-full.zip`：**包含大模型 (wanxiang-lts-zh-hant.gram)**
          files: |
            rime-wanxiang-base.zip
            rime-wanxiang-full.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
