# Generated Traditional overrides; upstream schema is unchanged.
patch:
  grammar/language: wanxiang-lts-zh-hant
  t2s:
    option_name: t2s
    opencc_config: wanxiang_t2s.json
    tips: none
    tags:
    - abc
  t2hk:
    option_name: t2hk
    opencc_config: wanxiang_t2hk.json
    tips: none
    tags:
    - abc
  t2tw:
    option_name: t2tw
    opencc_config: wanxiang_t2tw.json
    tips: none
    tags:
    - abc
  switches:
  - name: ascii_mode
    states:
    - 中文
    - 英文
  - name: ascii_punct
    states:
    - 中标
    - 英标
  - name: full_shape
    states:
    - 半角
    - 全角
  - name: emoji
    states:
    - 表情关
    - 表情开
  - name: chinese_english
    states:
    - 翻译关
    - 翻译开
  - name: charset_filter
    states:
    - 大字集
    - 小字集
    reset: 0
  - name: context_reorder
    states:
    - 上下文关
    - 上下文开
  - options:
    - raw_input
    - tone_display
    - full_pinyin
    states:
    - 原编码
    - 有声调
    - 无声调
    reset: 2
  - options:
    - t2t
    - t2s
    - t2hk
    - t2tw
    states:
    - 通繁
    - 簡體
    - 港繁
    - 臺繁
    reset: 3
  - options:
    - comment_off
    - tone_hint
    - toneless_hint
    states:
    - 注释关
    - 有声调
    - 无声调
    reset: 2
  - name: super_tips
    states:
    - 提示关
    - 提示开
    reset: 1
  - name: abbrev
    states:
    - 简码关
    - 简码开
    reset: 1
  engine/filters:
  - lua_filter@*wanxiang.super_lookup
  - lua_filter@*wanxiang.custom_phrase
  - lua_filter@*wanxiang.context_reorder*F
  - lua_filter@*wanxiang.super_comment_preedit
  - simplifier@t2s
  - simplifier@t2hk
  - simplifier@t2sw
  - simplifier@emoji
  - lua_filter@*wanxiang.super_replacer
  - lua_filter@*wanxiang.super_filter
  - uniquifier
  charset_filter:
  - option: charset_filter
    base: fth
    addlist:
    - 诶濛硷氽尛躝〇冇吔磺咗囧屌鲶芶咲畑垅𰻝𰻞龍朙頔雲
    blacklist: []
  - option: t2s
    base: fth
    addlist: []
    blacklist: []
  - option: t2hk
    base: fth
    addlist: []
    blacklist: []
  - option: t2tw
    base: fth
    addlist: []
    blacklist: []
  key_binder/bindings:
  - when: has_menu
    accept: 1
    send: apostrophe
  - when: composing
    accept: Control+Tab
    send_sequence: '{Home}{Shift+Right}{1}{Shift+Right}'
  - match: ^.*`$
    accept: '`'
    send_sequence: '{BackSpace}{Home}{`}{`}{End}'
  - when: composing
    accept: Return
    send: Shift+Return
